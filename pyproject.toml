[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-memory-moderator"
version = "1.0.0"
description = "Persistent Groq-powered Telegram summaries and reviewed moderation"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot[rate-limiter]>=22.8,<23", "httpx[socks]>=0.28,<0.29", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
memory-bot = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
